# support_status: BROKEN — store.morefine.com DNS failure
# Audited 2026-08-02. Do not enable without re-probe.
# Morefine — UNVERIFIED from sandbox (limited egress). On your machine run:
#   oem-radar probe https://store.morefine.com
# If it reports 'shopify', set enabled: true below. If 'woocommerce' or
# 'unknown', see docs/BIG_BRANDS.md (may need a different engine).
manufacturer:
  name: Morefine
  country: CN
sources:
  - id: morefine-shopify
    engine: shopify
    base_url: https://store.morefine.com
    min_interval: 12h
    discovery: [products_json, sitemap]
    currency_default: USD
    enabled: false
