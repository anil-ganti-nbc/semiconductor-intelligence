# support_status: BROKEN — peladn.com products.json 404 redirect to /
# Audited 2026-08-02. Do not enable without re-probe.
# Peladn — UNVERIFIED from sandbox (limited egress). On your machine run:
#   oem-radar probe https://peladn.com
# If it reports 'shopify', set enabled: true below. If 'woocommerce' or
# 'unknown', see docs/BIG_BRANDS.md (may need a different engine).
manufacturer:
  name: Peladn
  country: CN
sources:
  - id: peladn-shopify
    engine: shopify
    base_url: https://peladn.com
    min_interval: 12h
    discovery: [products_json, sitemap]
    currency_default: USD
    enabled: false
