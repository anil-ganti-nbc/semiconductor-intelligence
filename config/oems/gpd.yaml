# support_status: NEEDS_OWNER_PROBE — gpd.hk timed out from this environment
# Audited 2026-08-02. Do not enable without re-probe.
# GPD — UNVERIFIED from sandbox (limited egress). On your machine run:
#   oem-radar probe https://gpd.hk
# If it reports 'shopify', set enabled: true below. If 'woocommerce' or
# 'unknown', see docs/BIG_BRANDS.md (may need a different engine).
manufacturer:
  name: GPD
  country: CN
sources:
  - id: gpd-shopify
    engine: shopify
    base_url: https://gpd.hk
    min_interval: 12h
    discovery: [products_json, sitemap]
    currency_default: USD
    enabled: false
