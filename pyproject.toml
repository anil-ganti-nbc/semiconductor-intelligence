[project]
name = "semi-intel"
version = "3.3.13"
description = "Semiconductor intelligence platform -- claims, evidence, source trust, a knowledge graph, and Signal Radar-absorbed collection/candidate detection, for tech journalism research"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "feedparser>=6.0,<7.0",
    "alembic>=1.13,<2.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
web = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.29,<1.0"]
packaging = ["pyinstaller>=6.0,<7.0"]
# Optional X (Twitter) signal collection. Absent by default -- RSS and
# everything else must work with no `x` extra installed at all (brief
# section 17). See semi_intel/signals/providers/x/__init__.py.
x = ["playwright>=1.44,<2.0"]
dev = [
    "pytest>=7.0,<9.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.scripts]
semi-intel = "semi_intel.cli:app"
semintel = "semi_intel.operator:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semi_intel*"]

[tool.setuptools.package-data]
semi_intel = ["web/static/*.html"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
